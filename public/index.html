function compactNumber(n){if(!Number.isFinite(Number(n)))return '-';return new Intl.NumberFormat('id-ID',{notation:'compact',maximumFractionDigits:1}).format(Number(n))}
function localDateKey(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}

async function loadGoogleIdentity(){if(googleScriptPromise)return googleScriptPromise;googleScriptPromise=new Promise((resolve,reject)=>{if(window.google?.accounts?.id)return resolve();const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.defer=true;sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc)});return googleScriptPromise}

function sanitizeArticleHtml(html){
  const box=document.createElement('template');box.innerHTML=String(html||'');
  const allowed=new Set(['P','H2','H3','STRONG','B','EM','I','UL','OL','LI','A','BLOCKQUOTE','BR','FIGURE','FIGCAPTION','IMG']);
  const walk=node=>{[...node.children].forEach(el=>{if(el.tagName==='SCRIPT'||el.tagName==='STYLE'||el.tagName==='IFRAME'){el.remove();return}if(el.tagName==='H1'){const h=document.createElement('h2');h.innerHTML=el.innerHTML;el.replaceWith(h);walk(h);return}if(!allowed.has(el.tagName)){walk(el);const frag=document.createDocumentFragment();while(el.firstChild)frag.appendChild(el.firstChild);el.replaceWith(frag);return}for(const at of [...el.attributes]){const n=at.name.toLowerCase();if(el.tagName==='A'&&n==='href'){const href=at.value.trim();if(!/^(https?:|mailto:|\/|#)/i.test(href))el.removeAttribute(at.name)}else if(el.tagName==='A'&&['target','rel','title'].includes(n)){}else if(el.tagName==='IMG'&&['src','alt','title','loading'].includes(n)){if(n==='src'&&!/^(https?:|\/|\.\.?\/)/i.test(at.value.trim()))el.removeAttribute(at.name)}else el.removeAttribute(at.name)}if(el.tagName==='A'){el.setAttribute('rel','noopener noreferrer');if(/^https?:/i.test(el.getAttribute('href')||''))el.setAttribute('target','_blank')}walk(el)})};

function syncAudioUi(){const p=document.getElementById('audioPlayer'),btn=document.getElementById('audioMain'),st=document.getElementById('audioStatus'),bar=document.getElementById('audioProgress');if(!p||!btn||!st)return;const active=!!speechArticleId&&speechQueue.length>0;const playing=active&&!speechPaused;p.classList.toggle('playing',playing);btn.innerHTML=`<i class="fa-solid fa-${playing?'pause':'play'}"></i>`;const pct=active?Math.min(100,Math.round((speechIndex/Math.max(1,speechQueue.length))*100)):0;if(bar){bar.style.animation='none';bar.style.width=pct+'%'}st.textContent=active?(speechPaused?`Audio dijeda · bagian ${speechIndex+1}/${speechQueue.length}`:`Membacakan berita · bagian ${Math.min(speechIndex+1,speechQueue.length)}/${speechQueue.length}`):'Bacakan artikel dengan suara Bahasa Indonesia'}
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=()=>preferredIndonesianVoice();}

function openLiving(route,name){const close=`<button onclick="closeModal()">×</button>`;let body='';if(route==='weather'){body=`<div class="living-card"><i class="bi bi-cloud-sun"></i><b>Cuaca lokasi Anda</b><span id="weatherResult">Tekan tombol untuk membaca cuaca dari Open-Meteo.</span><button class="btn primary" style="width:100%;margin-top:10px" onclick="loadWeather()">Gunakan Lokasi Saya</button></div>`}else if(route==='prayer'){body=`<div class="living-card"><i class="fa-solid fa-mosque"></i><b>Jadwal Sholat</b><span id="prayerResult">Gunakan lokasi perangkat untuk mengambil jadwal hari ini.</span><button class="btn primary" style="width:100%;margin-top:10px" onclick="loadPrayer()">Ambil Jadwal</button></div>`}else if(route==='fx'){body=`<div class="living-card"><i class="bi bi-currency-exchange"></i><b>Kalkulator Kurs</b><span>Konversi sederhana untuk review UI.</span><div class="field"><input id="fxUsd" type="number" value="10" min="0"><input id="fxRate" type="number" value="16500" min="0" placeholder="Kurs USD/IDR"><button class="btn primary" onclick="document.getElementById('fxOut').textContent=money((+fxUsd.value||0)*(+fxRate.value||0))">Hitung</button></div><b id="fxOut">Rp165.000</b></div>`}else if(route==='gold'){body=`<div class="living-card"><i class="fa-solid fa-coins"></i><b>Kalkulator Emas</b><span>Masukkan berat dan harga emas/gram untuk menghitung nilai.</span><div class="field"><input id="goldGram" type="number" value="5"><input id="goldPrice" type="number" value="1500000"><button class="btn primary" onclick="document.getElementById('goldOut').textContent=money((+goldGram.value||0)*(+goldPrice.value||0))">Hitung</button></div><b id="goldOut">Rp7.500.000</b></div>`}else if(route==='transport'){body=`<div class="living-card"><i class="bi bi-bus-front"></i><b>Transportasi</b><span>Buka pencarian rute dan transportasi publik di Google Maps.</span><a class="btn primary" style="width:100%;margin-top:10px" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/">Buka Rute</a></div>`}else if(route==='health'){body=`<div class="living-card"><i class="fa-solid fa-heart-pulse"></i><b>Kalkulator BMI</b><span>Alat informasi umum, bukan diagnosis medis.</span><div class="field"><input id="bmiKg" type="number" value="65" placeholder="Berat kg"><input id="bmiCm" type="number" value="170" placeholder="Tinggi cm"><button class="btn primary" onclick="calcBmi()">Hitung BMI</button></div><b id="bmiOut">—</b></div>`}else if(route==='edu'){body=`<div class="living-card"><i class="bi bi-mortarboard"></i><b>Pendidikan</b><span>Akses cepat ke pencarian materi belajar dan informasi beasiswa.</span><div style="display:grid;gap:8px;margin-top:10px"><a class="btn" target="_blank" rel="noopener" href="https://scholar.google.com/">Google Scholar</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?q=beasiswa+Indonesia">Cari Beasiswa</a></div></div>`}else if(route==='bills'){body=`<div class="living-card"><i class="bi bi-receipt"></i><b>Perencana Tagihan</b><span>Jumlahkan tagihan bulanan sebelum terhubung ke payment provider.</span><div class="field"><input id="bill1" type="number" value="250000" placeholder="Listrik"><input id="bill2" type="number" value="150000" placeholder="Internet"><input id="bill3" type="number" value="100000" placeholder="Lainnya"><button class="btn primary" onclick="document.getElementById('billOut').textContent=money((+bill1.value||0)+(+bill2.value||0)+(+bill3.value||0))">Hitung Total</button></div><b id="billOut">Rp500.000</b></div>`}else if(route==='event'){body=`<div class="living-modal-grid"><div class="living-card"><i class="bi bi-calendar-event"></i><b>Agenda Komunitas</b><span>Pengajian, olahraga, UMKM, dan kegiatan warga dapat tampil di modul ini.</span></div><div class="living-card"><i class="fa-solid fa-location-dot"></i><b>Event Terdekat</b><span>Versi produksi dapat dihubungkan ke database/event API berdasarkan lokasi.</span></div></div>`}else if(route==='emergency'){body=`<div class="living-modal-grid"><a class="living-card" href="tel:112"><i class="fa-solid fa-phone-volume"></i><b>Darurat 112</b><span>Nomor panggilan darurat umum bila tersedia di wilayah Anda.</span></a><a class="living-card" href="tel:119"><i class="fa-solid fa-truck-medical"></i><b>Medis 119</b><span>Layanan kegawatdaruratan medis nasional.</span></a></div>`}else body=`<div class="living-card"><b>${name}</b><span>Fitur siap digunakan.</span></div>`;document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><h2 style="margin:0">${name}</h2><span class="meta">AINFO Living Assistance</span></div>${close}</div><div style="margin-top:14px">${body}</div></div></div>`}
function calcBmi(){const kg=+document.getElementById('bmiKg').value||0,cm=+document.getElementById('bmiCm').value||0;const bmi=cm?kg/((cm/100)**2):0;document.getElementById('bmiOut').textContent=bmi?`BMI ${bmi.toFixed(1)}`:'Masukkan data yang valid.'}
function loadWeather(){if(!navigator.geolocation)return toast('Geolocation tidak tersedia.');const out=document.getElementById('weatherResult');out.textContent='Mengambil lokasi…';navigator.geolocation.getCurrentPosition(async p=>{try{const {latitude,longitude}=p.coords;const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`);const d=await r.json();out.innerHTML=`Suhu <b>${d.current?.temperature_2m??'-'}°C</b> · Terasa ${d.current?.apparent_temperature??'-'}°C · Angin ${d.current?.wind_speed_10m??'-'} km/jam`}catch(e){out.textContent='Cuaca gagal dimuat.'}},()=>out.textContent='Izin lokasi tidak diberikan.')}
function loadPrayer(){if(!navigator.geolocation)return toast('Geolocation tidak tersedia.');const out=document.getElementById('prayerResult');out.textContent='Mengambil lokasi…';navigator.geolocation.getCurrentPosition(async p=>{try{const {latitude,longitude}=p.coords;const r=await fetch(`https://api.aladhan.com/v1/timings?latitude=${latitude}&longitude=${longitude}&method=20`);const d=await r.json();const t=d.data?.timings||{};out.innerHTML=`Subuh <b>${t.Fajr||'-'}</b> · Dzuhur <b>${t.Dhuhr||'-'}</b> · Ashar <b>${t.Asr||'-'}</b> · Maghrib <b>${t.Maghrib||'-'}</b> · Isya <b>${t.Isha||'-'}</b>`}catch(e){out.textContent='Jadwal sholat gagal dimuat.'}},()=>out.textContent='Izin lokasi tidak diberikan.')}

function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function shop(){const savedCats=(()=>{try{return JSON.parse(localStorage.getItem('ainfo-shop-categories')||'[]')}catch(e){return[]}})();const catNames=[...new Set([...products.map(p=>p.cat).filter(Boolean),...savedCats])];const iconMap={'Elektronik':'fa-mobile-screen-button','Fashion':'fa-shirt','Beauty':'fa-wand-magic-sparkles','Rumah':'fa-house','Olahraga':'fa-dumbbell','Ibu & Anak':'fa-baby','Otomotif':'fa-car','Hobi':'fa-book'};const cats=(catNames.length?catNames:['Elektronik','Fashion','Beauty','Rumah']).map(l=>[iconMap[l]||'fa-tags',l]);const flash=products.filter(p=>p.flashSale);return `<div class="page"><div class="shop-top"><div class="container"><div class="shop-hero"><div class="shop-banner"><span class="badge orange">AINFO SHOPPING</span><h1>Belanja mudah, cepat, dan tetap dekat dengan informasi.</h1><p>Temukan produk pilihan, promo harian, dan rekomendasi terpercaya dalam satu ekosistem AINFO.</p><button class="btn" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})"><i class="bi bi-bag-check"></i> Mulai Belanja</button></div><div class="shop-mini"><div class="shop-mini-card"><i class="fa-solid fa-bolt"></i><b>${flash.length||0} Flash Sale</b><span class="meta">Promo aktif dari Dashboard Admin</span></div><div class="shop-mini-card"><i class="fa-solid fa-shield-halved"></i><b>Belanja Aman</b><span class="meta">Checkout terlindungi</span></div></div></div><div class="shop-cats">${cats.map(([i,l])=>`<div class="shop-cat"><i class="fa-solid ${i}"></i><span>${escapeHtml(l)}</span></div>`).join('')}</div></div></div><div class="container shop-section" id="products">${flash.length?`<div class="section-head"><h2><i class="fa-solid fa-bolt" style="color:var(--orange)"></i> Flash Sale</h2><span class="badge orange">${flash.length} Produk</span></div><div class="product-grid">${flash.slice(0,4).map(productCard).join('')}</div>`:''}<div class="section-head"><h2>Rekomendasi Produk</h2><span class="badge orange">Promo Hari Ini</span></div><div class="product-grid">${products.map(productCard).join('')}</div><div class="section-head"><h2>5 Produk Pilihan</h2><button>Lihat lainnya <i class="bi bi-arrow-right"></i></button></div><div class="product-list">${products.slice(0,5).map(productList).join('')}</div></div></div>`}
function productCard(p){return `<article class="product-card" onclick="go('product/${p.id}')"><div class="product-img"><img loading="lazy" src="${p.image}" alt="${escapeHtml(p.name)}">${p.flashSale?'<span class="flash-badge">FLASH SALE</span>':''}${p.discount?`<span class="discount">-${escapeHtml(p.discount)}</span>`:''}</div><div class="product-pad"><h3>${escapeHtml(p.name)}</h3><div class="price">${money(p.price)}</div><div class="product-meta"><span><i class="fa-solid fa-star" style="color:#f6b400"></i> ${p.rating} • ${p.sold} terjual</span><span>${escapeHtml(p.city||'')}</span></div>${Number.isFinite(Number(p.stock))?`<div class="stock-note">Stok ${Number(p.stock)}</div>`:''}</div></article>`}
function productList(p){return `<article class="product-list-item" onclick="go('product/${p.id}')"><div class="product-img"><img loading="lazy" src="${p.image}" alt="${p.name}"></div><div><span class="badge orange">${p.cat}</span><h3>${p.name}</h3><div class="price">${money(p.price)}</div><span class="meta">★ ${p.rating} • ${p.sold} terjual • ${p.city}</span></div><button class="btn orange">Lihat Produk</button></article>`}
function productDetail(id){const p=products.find(x=>x.id===id)||products[0];return `<div class="page"><div class="container shop-section"><div class="breadcrumb" style="color:var(--orange)">AINFO Shopping / ${p.cat} / Detail Produk</div><div class="product-detail" style="margin-top:12px"><div><div class="pd-main"><img src="${p.image}" alt="${p.name}"></div><div class="pd-thumbs"><div class="pd-thumb"><img src="${p.image}" alt="${p.name}"></div><div class="pd-thumb"><img src="${p.image}" alt="${p.name}"></div><div class="pd-thumb"><img src="${p.image}" alt="${p.name}"></div><div class="pd-thumb"><img src="${p.image}" alt="${p.name}"></div></div></div><div class="pd-info"><span class="badge orange">Mall Pilihan</span><h1>${p.name}</h1><div class="pd-rating"><strong>${p.rating} ★</strong><span>1,2RB penilaian</span><span>${p.sold} terjual</span></div><div class="pd-price">${money(p.price)} <del style="font-size:13px;color:#9ca3af;font-weight:500">${money(p.old)}</del></div><div class="pd-box"><b style="font-size:12px"><i class="fa-solid fa-truck-fast" style="color:var(--orange)"></i> Pengiriman</b><div class="meta" style="margin-top:6px">Dikirim dari ${p.city} • Estimasi 2–4 hari • Gratis ongkir sesuai syarat</div></div><div class="field"><label>Variasi</label><div class="variant-row"><button class="variant active">Hitam</button><button class="variant">Putih</button><button class="variant">Biru</button></div></div><div class="field"><label>Jumlah</label><div class="qty"><button onclick="qty(-1)">−</button><span id="qty">1</span><button onclick="qty(1)">+</button></div></div><div class="pd-actions"><button class="btn" style="border-color:var(--orange);color:var(--orange)" onclick="addCart(${p.id})"><i class="bi bi-cart-plus"></i> Tambah Keranjang</button><button class="btn orange" onclick="buyNow(${p.id})">Beli Sekarang</button></div></div></div><div class="panel" style="margin-top:14px"><h3>Deskripsi Produk</h3><p style="font-size:12px;line-height:1.7;color:#536174">Produk pilihan AINFO Shopping dengan informasi harga, rating, variasi, pengiriman, dan CTA sticky pada perangkat mobile. Pada produksi, data produk dapat diambil dari database atau API marketplace yang Anda miliki.</p></div><div class="panel" style="margin-top:14px"><h3>Penilaian Produk</h3><div class="review-list"><div class="review"><b>Budi S. • ★★★★★</b><p>Produk sesuai deskripsi, packing rapi, pengiriman cepat.</p></div><div class="review"><b>Sari D. • ★★★★★</b><p>Kualitas bagus dan tampilan produk sesuai foto.</p></div></div></div><div class="section-head"><h2>Produk Serupa</h2></div><div class="product-grid">${products.filter(x=>x.id!==p.id).slice(0,4).map(productCard).join('')}</div></div><div class="sticky-buy"><button class="btn" style="border-color:var(--orange);color:var(--orange)" onclick="addCart(${p.id})"><i class="bi bi-cart-plus"></i> Keranjang</button><button class="btn orange" onclick="buyNow(${p.id})">Beli Sekarang</button></div></div>`}
function qty(d){const el=document.getElementById('qty');el.textContent=Math.max(1,Number(el.textContent)+d)}
function addCart(id){const q=Number(document.getElementById('qty')?.textContent||1);if(!state.cart.includes(id))state.cart.push(id);state.cartQty[id]=(state.cartQty[id]||0)+q;save();nav();toast(`${q} produk masuk keranjang`)}
function buyNow(id){addCart(id);go('cart')}
function cartCount(){return state.cart.reduce((n,id)=>n+(state.cartQty[id]||1),0)}
function cartSubtotal(){return state.cart.reduce((sum,id)=>{const p=products.find(x=>x.id===id);return sum+(p?p.price*(state.cartQty[id]||1):0)},0)}
function cartQty(id,d){state.cartQty[id]=Math.max(1,(state.cartQty[id]||1)+d);save();render()}
function removeCart(id){state.cart=state.cart.filter(x=>x!==id);delete state.cartQty[id];save();render();toast('Produk dihapus dari keranjang')}
function cartPage(){const subtotal=cartSubtotal(),shipping=state.cart.length?15000:0,total=subtotal+shipping;return `<div class="page"><div class="container"><div class="section-head"><div><span class="badge orange">AINFO SHOPPING</span><h2 style="margin-top:7px">Keranjang & Checkout</h2></div><button onclick="go('shop')">Lanjut Belanja</button></div>${state.cart.length?`<div class="cart-layout"><section class="panel" style="padding:0">${state.cart.map(id=>{const p=products.find(x=>x.id===id);if(!p)return'';const q=state.cartQty[id]||1;return `<div class="cart-item"><img src="${p.image}" alt="${escapeHtml(p.name)}"><div><b style="font-size:12px">${escapeHtml(p.name)}</b><div class="price">${money(p.price)}</div><div class="qty" style="margin-top:8px"><button onclick="cartQty(${id},-1)">−</button><span>${q}</span><button onclick="cartQty(${id},1)">+</button></div></div><div style="text-align:right"><b>${money(p.price*q)}</b><button class="btn danger" style="margin-top:8px;padding:6px" onclick="removeCart(${id})"><i class="bi bi-trash"></i></button></div></div>`}).join('')}</section><aside class="panel cart-summary"><h3>Ringkasan Belanja</h3><div class="checkout-total"><span>Subtotal (${cartCount()} barang)</span><b>${money(subtotal)}</b></div><div class="checkout-total"><span>Estimasi ongkir</span><b>${money(shipping)}</b></div><div class="checkout-total grand"><span>Total</span><span style="color:var(--orange)">${money(total)}</span></div><button class="btn orange" style="width:100%;margin-top:10px" onclick="checkoutModal()"><i class="bi bi-credit-card"></i> Checkout</button></aside></div>`:`<div class="panel" style="text-align:center;padding:38px"><i class="bi bi-cart3" style="font-size:40px;color:#9aa6b5"></i><h3>Keranjang masih kosong</h3><p class="muted">Tambahkan produk dari AINFO Shopping.</p><button class="btn orange" onclick="go('shop')">Mulai Belanja</button></div>`}</div></div>`}
function checkoutModal(){if(!authUser){toast('Login diperlukan untuk checkout.');return go('login')}if(!authUser.profile_complete){toast('Lengkapi profile agar data pengiriman otomatis terisi.');return go('onboarding')}const subtotal=cartSubtotal(),shipping=15000,total=subtotal+shipping;document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal" style="max-width:680px"><div class="modal-head"><div><h2 style="margin:0">Checkout AINFO Shopping</h2><span class="meta">Data pembeli diambil dari Profile AINFO · Total ${money(total)}</span></div><button onclick="closeModal()">×</button></div><div class="checkout-methods" style="margin:14px 0"><button class="checkout-method active" id="mDoku" onclick="setCheckoutMethod('doku')"><i class="fa-solid fa-wallet"></i><b>DOKU Checkout</b><div class="meta">VA, QRIS, kartu & e-wallet aktif sesuai merchant</div></button><button class="checkout-method" id="mWa" onclick="setCheckoutMethod('wa')"><i class="fa-brands fa-whatsapp" style="color:#25d366"></i><b>Checkout WhatsApp</b><div class="meta">Kirim detail pesanan otomatis ke toko</div></button></div><form class="checkout-form" onsubmit="submitCheckout(event)"><input type="hidden" id="checkoutMethod" value="doku"><div class="field"><label>Nama lengkap</label><input id="coName" required value="${escapeHtml(state.profile.name||'')}"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="field"><label>No. HP / WhatsApp</label><input id="coPhone" required placeholder="08xxxxxxxxxx" value="${escapeHtml(state.profile.phone||'')}"></div><div class="field"><label>Email</label><input id="coEmail" type="email" required value="${escapeHtml(state.profile.email||'')}"></div></div><div class="field"><label>Alamat pengiriman</label><textarea id="coAddress" rows="3" required placeholder="Alamat lengkap, kecamatan, kota/kabupaten">${escapeHtml(state.profile.address||'')}</textarea></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="field"><label>Kota</label><input id="coCity" required value="${escapeHtml(state.profile.city||'')}"></div><div class="field"><label>Kode Pos</label><input id="coPostal" required value="${escapeHtml(state.profile.postal_code||'')}"></div></div><div class="field"><label>Catatan (opsional)</label><textarea id="coNote" rows="2"></textarea></div><div class="panel" style="padding:10px"><div class="checkout-total"><span>Subtotal</span><b>${money(subtotal)}</b></div><div class="checkout-total"><span>Ongkir</span><b>${money(shipping)}</b></div><div class="checkout-total grand"><span>Total</span><b>${money(total)}</b></div></div><button class="btn orange" style="width:100%" type="submit"><i class="bi bi-lock"></i> Lanjutkan Checkout</button></form></div></div>`}
function setCheckoutMethod(m){document.getElementById('checkoutMethod').value=m;document.getElementById('mDoku').classList.toggle('active',m==='doku');document.getElementById('mWa').classList.toggle('active',m==='wa')}
function checkoutPayload(){return {customer:{name:coName.value,email:coEmail.value,phone:coPhone.value,address:coAddress.value,city:coCity.value,postal_code:coPostal.value},note:coNote.value,shipping:15000,items:state.cart.map(id=>{const p=products.find(x=>x.id===id);return {id,name:p.name,price:p.price,quantity:state.cartQty[id]||1,image:p.image}})}}
async function submitCheckout(e){e.preventDefault();const method=document.getElementById('checkoutMethod').value,payload=checkoutPayload();if(method==='wa')return checkoutWhatsApp(payload);try{const btn=e.submitter;btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Menghubungkan DOKU…';const res=await fetch('/api/doku/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||data.error||'DOKU belum dikonfigurasi');if(data.payment_url){window.open(data.payment_url,'_blank','noopener,noreferrer');toast('DOKU Checkout dibuka');closeModal()}else throw new Error('Payment URL tidak diterima')}catch(err){toast(err.message||String(err));const btn=e.submitter;if(btn){btn.disabled=false;btn.innerHTML='<i class="bi bi-lock"></i> Lanjutkan Checkout'}}}
function checkoutWhatsApp(payload){let target=(state.settings.whatsapp||'').replace(/\D/g,'');if(!target){target=prompt('Mode review: masukkan nomor WhatsApp toko, format 628xxxx')||'';target=target.replace(/\D/g,'')}if(!target)return toast('Nomor WhatsApp toko belum dikonfigurasi');const subtotal=cartSubtotal(),shipping=payload.shipping,total=subtotal+shipping;const lines=['*PESANAN AINFO SHOPPING*','',...payload.items.map((x,i)=>`${i+1}. ${x.name}\n${x.quantity} x ${money(x.price)} = ${money(x.quantity*x.price)}`),'',`Subtotal: ${money(subtotal)}`,`Ongkir: ${money(shipping)}`,`*TOTAL: ${money(total)}*`,'',`Nama: ${payload.customer.name}`,`HP: ${payload.customer.phone}`,`Email: ${payload.customer.email}`,`Alamat: ${payload.customer.address}, ${payload.customer.city} ${payload.customer.postal_code}`,payload.note?`Catatan: ${payload.note}`:''];window.open(`https://wa.me/${target}?text=${encodeURIComponent(lines.filter(Boolean).join('\n'))}`,'_blank','noopener,noreferrer');toast('Checkout WhatsApp disiapkan');closeModal()}

function activeJobs(){return liveJobs.length?liveJobs:jobs}
function jobsPage(){const list=activeJobs();const sel=list.find(x=>String(x.id)===String(state.selectedJob))||list[0];const status=liveJobs.length?`<div class="job-livebar"><span style="display:flex;align-items:center;gap:8px"><span class="live-dot"></span><b>Live Jooble</b> · ${liveJobs.length} lowongan ditampilkan</span><span>Cache aktif untuk menghemat kuota API</span></div>`:liveJobsError?`<div class="job-livebar error"><span><i class="fa-solid fa-circle-exclamation"></i> ${liveJobsError}</span><span>Menampilkan data demo.</span></div>`:`<div class="job-livebar"><span><i class="fa-solid fa-rotate fa-spin"></i> Menghubungkan Jooble…</span><span>Mohon tunggu</span></div>`;return `<div class="page"><section class="jobs-hero"><div class="container"><span class="badge" style="background:rgba(255,255,255,.14);color:#fff">AINFO JOBS · JOOBLE</span><h1>Temukan pekerjaan yang cocok untuk langkah berikutnya.</h1><p>Pencarian lowongan live melalui Jooble, detail pekerjaan, simpan lowongan, dan tautan lamaran ke sumber asli.</p><div class="job-search"><div class="field-inline"><i class="fa-solid fa-magnifying-glass"></i><input id="jobKeyword" value="${escapeHtml(window.__jobKeyword||((()=>{try{return JSON.parse(localStorage.getItem('ainfo-job-settings')||'{}').keywords}catch(e){return''}})()||'HSE'))}" placeholder="Jabatan, keahlian, atau perusahaan" onkeydown="if(event.key==='Enter')searchJobs(false)"></div><div class="field-inline"><i class="fa-solid fa-location-dot"></i><input id="jobLocation" value="${escapeHtml(window.__jobLocation||((()=>{try{return JSON.parse(localStorage.getItem('ainfo-job-settings')||'{}').location}catch(e){return''}})()||'Indonesia'))}" placeholder="Kota atau wilayah" onkeydown="if(event.key==='Enter')searchJobs(false)"></div><button class="btn primary" onclick="searchJobs(false)"><i class="fa-solid fa-magnifying-glass"></i> Cari Lowongan</button></div><div class="job-filter-row">${['HSE / K3','Reporter','Developer','Marketing','Admin','Remote'].m function normalizeJoobleJob(j){const title=stripTags(j.title||'Lowongan');const company=stripTags(j.company||j.source||'Perusahaan');const snippet=stripTags(j.snippet||'Detail lengkap tersedia pada sumber lowongan.');const initials=(company.match(/\b\w/g)||['J']).slice(0,2).join('').toUpperCase();return {id:String(j.id||j.link||Math.random()),title,company,location:stripTags(j.location||'-'),salary:stripTags(j.salary||'Gaji tidak dicantumkan'),type:stripTags(j.type||'Tidak dicantumkan'),age:j.updated?new Date(j.updated).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'Terbaru',logo:initials,source:stripTags(j.source||'Jooble'),link:j.link||'',tags:[j.type||'Lowongan',j.source||'Jooble'].filter(Boolean),desc:snippet,req:['Baca persyaratan dan kualifikasi lengkap pada sumber lowongan asli.','Pastikan profil/CV Anda sesuai dengan posisi sebelum melamar.'],updated:j.updated||''}}
function stripTags(v){const d=document.createElement('div');d.innerHTML=String(v||'');return d.textContent||d.innerText||''}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function searchJobs(initial=false){const keyword=(document.getElementById('jobKeyword')?.value||window.__jobKeyword||((()=>{try{return JSON.parse(localStorage.getItem('ainfo-job-settings')||'{}').keywords}catch(e){return''}})()||'HSE')).trim();const locationValue=(document.getElementById('jobLocation')?.value||window.__jobLocation||((()=>{try{return JSON.parse(localStorage.getItem('ainfo-job-settings')||'{}').location}catch(e){return''}})()||'Indonesia')).trim();window.__jobKeyword=keyword;window.__jobLocation=locationValue;const status=document.getElementById('jobStatus');if(status)status.innerHTML='<div class="job-livebar"><span><i class="fa-solid fa-rotate fa-spin"></i> Mencari lowongan Jooble…</span><span>Live search</span></div>';try{const url=`/api/jobs?keywords=${encodeURIComponent(keyword||'HSE')}&location=${encodeURIComponent(locationValue||'Indonesia')}&page=1`;const res=await fetch(url,{headers:{Accept:'application/json'}});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||data.error||`HTTP ${res.status}`);liveJobs=(data.jobs||[]).map(normalizeJoobleJob);liveJobsLoaded=true;liveJobsError='';if(liveJobs.length)state.selectedJob=String(liveJobs[0].id);save();render();if(!initial)toast(`${liveJobs.length} lowongan Jooble ditemukan`)}catch(err){liveJobsLoaded=true;liveJobsError=String(err.message||err).includes('missing_api_key')?'API key Jooble belum dimasukkan pada launcher lokal.':`Jooble belum dapat dimuat: ${err.message||err}`;if(!initial)toast(liveJobsError);render()}}
function quickJob(k){window.__jobKeyword=k==='HSE / K3'?'HSE':k;setTimeout(()=>{const el=document.getElementById('jobKeyword');if(el)el.value=window.__jobKeyword;searchJobs(false)},0)}

function profilePage(){if(!authUser)return `<div class="page"><div class="container"><div class="panel profile-login-cta"><i class="bi bi-person-circle"></i><h2>Masuk ke akun AINFO</h2><p class="muted">Login untuk mengelola profile, bookmark, keranjang, lowongan tersimpan dan Gift Author.</p><div style="display:flex;gap:8px;justify-content:center"><button class="btn primary" onclick="go('login')">Login</button><button class="btn" onclick="go('register')">Registrasi</button></div></div></div></div>`;const name=state.profile.name||authUser.username||'AINFO Member';return `<div class="page"><div class="container"><section class="profile-hero"><div class="profile-row">${state.profile.avatar?`<img src="${escapeHtml(state.profile.avatar)}" class="profile-avatar" style="object-fit:cover">`:`<div class="profile-avatar">${name.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}</div>`}<div class="profile-name"><h1>${escapeHtml(name)}</h1><p>@${escapeHtml(authUser.username||'member')} · ${escapeHtml(state.profile.email)} • Member AINFO</p><span class="badge" style="margin-top:8px;background:rgba(255,255,255,.16);color:#fff">${authUser.provider==='google'?'Google Member':'AINFO Member'}</span></div></div><div class="profile-address"><b><i class="bi bi-geo-alt"></i> Alamat checkout</b><br>${escapeHtml(state.profile.address||'Belum diisi')}${state.profile.city?`, ${escapeHtml(state.profile.city)}`:''}${state.profile.postal_code?` ${escapeHtml(state.profile.postal_code)}`:''}<br><i class="fa-brands fa-whatsapp"></i> ${escapeHtml(state.profile.phone||'Belum diisi')}</div><div class="profile-stats"><div class="profile-stat"><b>${state.saved.length}</b><span>Artikel Tersimpan</span></div><div class="profile-stat"><b>${state.jobSaved.length}</b><span>Lowongan Disimpan</span></div><div class="profile-stat"><b>${cartCount()}</b><span>Keranjang</span></div><div class="profile-stat"><b>${giftHistory.length}</b><span>Gift DOKU</span></div></div></section><div class="profile-grid"><section class="panel"><div class="section-head" style="margin:0 0 12px"><h2>Akun & Aktivitas</h2></div><div class="profile-menu"><button onclick="go('saved')"><i class="bi bi-bookmark"></i><span>Tersimpan<small class="meta" style="display:block">Artikel & lowongan</small></span></button><button onclick="go('cart')"><i class="bi bi-cart3"></i><span>Keranjang<small class="meta" style="display:block">${cartCount()} barang</small></span></button><button onclick="toast('Riwayat komentar dibuka')"><i class="bi bi-chat-left-text"></i><span>Komentar Saya<small class="meta" style="display:block">Kelola diskusi</small></span></button><button onclick="toast('Riwayat rating dibuka')"><i class="bi bi-star"></i><span>Rating & Reaction<small class="meta" style="display:block">Aktivitas berita</small></span></button><button onclick="editProfile()"><i class="bi bi-person-gear"></i><span>Edit Profile<small class="meta" style="display:block">Data pembeli & akun</small></span></button><button onclick="go('onboarding')"><i class="bi bi-truck"></i><span>Alamat Checkout<small class="meta" style="display:block">Pengiriman Shop</small></span></button><button onclick="toast('Pengaturan notifikasi dibuka')"><i class="bi bi-bell"></i><span>Notifikasi<small class="meta" style="display:block">Preferensi alert</small></span></button><button onclick="logoutUser()"><i class="bi bi-box-arrow-right"></i><span>Logout<small class="meta" style="display:block">Keluar dari sesi</small></span></button></div></section><aside class="panel"><h3>Aktivitas Terbaru</h3><div class="profile-activity"><div class="activity-item"><i class="bi bi-bookmark-fill"></i><div><b>Bookmark berita</b><div class="meta">${state.saved.length} artikel tersimpan</div></div></div><div class="activity-item"><i class="fa-solid fa-briefcase"></i><div><b>Lowongan tersimpan</b><div class="meta">${state.jobSaved.length} pekerjaan</div></div></div><div class="activity-item"><i class="fa-solid fa-gift"></i><div><b>Gift Author</b><div class="meta">${giftHistory.length?giftHistory.slice(0,2).map(g=>`${money(g.amount)} · ${g.status}`).join(' / '):'Belum ada transaksi'}</div></div></div><div class="activity-item"><i class="bi bi-cart-check"></i><div><b>AINFO Shopping</b><div class="meta">Data checkout siap otomatis dari profile</div></div></div></div></aside></div></div></div>`}

function videoPage(){return `<div class="video-discovery"><div class="container"><div class="video-discovery-head"><div><span class="badge red"><i class="bi bi-play-fill"></i> AINFO VIDEO</span><h1>Video Berita</h1><p class="muted" style="margin:5px 0 0;font-size:11px">Grid dua kolom dengan carousel geser. Klik video untuk membuka viewer vertikal penuh.</p></div><div class="video-carousel-actions"><button onclick="scrollVideoCarousel(-1)" aria-label="Geser kiri"><i class="bi bi-chevron-left"></i></button><button onclick="scrollVideoCarousel(1)" aria-label="Geser kanan"><i class="bi bi-chevron-right"></i></button></div></div><div class="chips">${['Untuk Anda','Berita','Teknologi','Lifestyle','Travel'].map((x,i)=>`<button class="chip ${i===0?'active':''}">${x}</button>`).join('')}</div><div class="video-carousel" id="videoCarousel">${shortVideos.concat(shortVideos).map((v,i)=>`<article class="video-card" onclick="go('video/${v.id}')"><img loading="lazy" src="${v.poster}" alt="${escapeHtml(v.title)}"><div class="video-card-play"><span><i class="fa-solid fa-play"></i></span></div><div class="video-card-copy"><span class="badge" style="background:rgba(0,0,0,.45);color:#fff">${v.cat}</span><h3>${v.title}</h3><div class="meta"><i class="fa-solid fa-heart"></i> ${v.likes} · <i class="fa-regular fa-comment"></i> ${v.comments}</div></div></article>`).join('')}</div><div class="section-head"><h2>Terbaru</h2><span class="meta">Geser untuk melihat lebih banyak</span></div><div class="video-carousel">${shortVideos.slice().reverse().concat(shortVideos).map(v=>`<article class="video-card" onclick="go('video/${v.id}')"><img loading="lazy" src="${v.poster}" alt="${escapeHtml(v.title)}"><div class="video-card-copy"><span class="badge" style="background:rgba(0,0,0,.45);color:#fff">${v.cat}</span><h3>${v.title}</h3><div class="meta">@ainfo · ${v.likes} suka</div></div></article>`).join('')}</div></div></div>`}

function videoSlide(v){const p=products.find(x=>x.id===v.productId)||products[0];return `<section class="video-viewer-shell" data-video-id="${v.id}"><video class="feed-video" playsinline loop muted poster="${v.poster}" src="${v.src}" onclick="toggleFeedVideo(this)"></video><div class="video-viewer-head"><button class="video-viewer-close" onclick="go('video')" aria-label="Tutup video"><i class="bi bi-x-lg"></i></button><div class="video-viewer-tabs"><span>Mengikuti</span><span class="active">Untuk Anda</span></div><button class="video-viewer-search" onclick="toast('Pencarian video dibuka')" aria-label="Cari video"><i class="bi bi-search"></i></button></div><div class="video-viewer-copy"><div class="author-name">@${escapeHtml(v.author.replace(/\s+/g,'').toLowerCase())}</div><h2>${escapeHtml(v.title)}</h2><p>${escapeHtml(v.caption||'Video berita AINFO.')}</p><div class="video-product" onclick="go('shop/${p.id}')"><span class="cart-badge"><i class="fa-solid fa-cart-shopping"></i></span><span><span class="vp-name">${escapeHtml(p.name)}</span><span class="vp-price">${money(p.price)}</span></span><span class="vp-link">Lihat</span></div><div class="video-sound"><i class="fa-solid fa-music"></i><span>AINFO Original Sound · ${escapeHtml(v.author)}</span></div></div><div class="video-viewer-actions"><button onclick="event.stopPropagation();toggleVideoFollow(this)"><span class="video-author"><img src="${v.avatar}" alt="${escapeHtml(v.author)}"><span class="video-author-plus">+</span></span><span>${escapeHtml(v.author.split(' ')[0])}</span></button><button onclick="event.stopPropagation();videoLike(this)"><i class="fa-regular fa-heart"></i><span>${v.likes}</span></button><button onclick="event.stopPropagation();toast('${v.comments} komentar')"><i class="fa-solid fa-comment-dots"></i><span>${v.comments}</span></button><button onclick="event.stopPropagation();toast('Video disimpan')"><i class="fa-solid fa-bookmark"></i><span>Simpan</span></button><button onclick="event.stopPropagation();shareVideo('${escapeHtml(v.title)}')"><i class="fa-solid fa-share"></i><span>${v.shares||'Bagikan'}</span></button></div><div class="video-progress"><span></span></div></section>`}
function videoViewer(id){return `<div class="video-viewer"><div class="video-feed" id="videoFeed">${shortVideos.map(videoSlide).join('')}</div></div>`}
function initVideoViewer(id){const feed=document.getElementById('videoFeed');const target=feed?.querySelector(`[data-video-id="${id}"]`);if(target)feed.scrollTop=target.offsetTop;window.__videoSoundEnabled=window.__videoSoundEnabled||false;const videos=[...document.querySelectorAll('.feed-video')];const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{const shell=entry.target.closest('.video-viewer-shell');if(entry.isIntersecting&&entry.intersectionRatio>.65){videos.forEach(v=>{if(v!==entry.target){v.pause();v.muted=true;v.closest('.video-viewer-shell')?.classList.remove('active')}});entry.target.muted=!window.__videoSoundEnabled;entry.target.play().catch(()=>{entry.target.muted=true;entry.target.play().catch(()=>{})});shell?.classList.add('active');const vid=Number(shell?.dataset.videoId||0);if(vid&&String(location.hash).split('/').pop()!==String(vid))history.replaceState(null,'','#/video/'+vid)}else{entry.target.pause();shell?.classList.remove('active')}})},{root:feed,threshold:[.25,.65,.9]});videos.forEach(v=>observer.observe(v));window.__videoObserver=observer;window.onkeydown=e=>{if(e.key==='Escape')go('video')}}
function toggleFeedVideo(v){if(v.muted){window.__videoSoundEnabled=true;v.muted=false;v.play().catch(()=>{});toast('Suara video aktif');return}if(v.paused)v.play().catch(()=>{});else v.pause()}
function toggleVideoFollow(btn){const a=btn.querySelector('.video-author');a?.classList.toggle('following');const plus=a?.querySelector('.video-author-plus');if(plus)plus.textContent=a.classList.contains('following')?'✓':'+';toast(a?.classList.contains('following')?'Author diikuti':'Berhenti mengikuti author')}
function videoLike(btn){const i=btn.querySelector('i');i.classList.toggle('fa-regular');i.classList.toggle('fa-solid');i.style.color=i.classList.contains('fa-solid')?'#ff365f':''}
async function shareVideo(title){if(navigator.share)try{await navigator.share({title,text:title,url:location.href})}catch(e){}else{navigator.clipboard?.writeText(location.href);toast('Link video disalin')}}

const WMO={0:['Cerah','fa-sun'],1:['Cerah berawan','fa-cloud-sun'],2:['Berawan','fa-cloud-sun'],3:['Mendung','fa-cloud'],45:['Berkabut','fa-smog'],48:['Kabut beku','fa-smog'],51:['Gerimis','fa-cloud-rain'],53:['Gerimis','fa-cloud-rain'],55:['Gerimis lebat','fa-cloud-rain'],61:['Hujan ringan','fa-cloud-rain'],63:['Hujan','fa-cloud-showers-heavy'],65:['Hujan lebat','fa-cloud-showers-heavy'],71:['Salju ringan','fa-snowflake'],73:['Salju','fa-snowflake'],75:['Salju lebat','fa-snowflake'],80:['Hujan lokal','fa-cloud-rain'],81:['Hujan lokal','fa-cloud-showers-heavy'],82:['Hujan sangat lebat','fa-cloud-showers-heavy'],95:['Badai petir','fa-cloud-bolt'],96:['Badai petir','fa-cloud-bolt'],99:['Badai petir','fa-cloud-bolt']};
function weatherInfo(code){return WMO[Number(code)]||['Cuaca berubah','fa-cloud-sun']}
function windDir(d){const x=['U','TL','T','TG','S','BD','B','BL'];return x[Math.round((Number(d)||0)/45)%8]}
function moonPhase(date=new Date()){const lp=2551443;const newMoon=new Date('2000-01-06T18:14:00Z');const phase=((date-newMoon)/1000%lp+lp)%lp/lp;const pct=Math.round((phase<=.5?phase*2:(1-phase)*2)*100);const name=phase<.03||phase>.97?'Bulan Baru':phase<.22?'Sabit Muda':phase<.28?'Perbani Awal':phase<.47?'Cembung Muda':phase<.53?'Purnama':phase<.72?'Cembung Tua':phase<.78?'Perbani Akhir':'Sabit Tua';return {name,pct}}
async function reverseLocation(lat,lon){try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=id`);const d=await r.json();return {city:d.city||d.locality||d.principalSubdivision||'Lokasi Anda',region:d.principalSubdivision||'',country:d.countryName||'Indonesia'}}catch(e){return {city:'Lokasi Anda',region:'',country:'Indonesia'}}}
function svgWeatherChart(times,temps,probs){if(!temps.length)return'';const w=900,h=190,pad=24,min=Math.min(...temps)-2,max=Math.max(...temps)+2,range=max-min||1;const pts=temps.map((t,i)=>[pad+i*((w-pad*2)/(Math.max(temps.length-1,1))),h-pad-(t-min)/range*(h-pad*2)]);const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const area=`M ${pts[0][0]} ${h-pad} ${line.replace(/^M /,'L ')} L ${pts.at(-1)[0]} ${h-pad} Z`;const labels=pts.filter((_,i)=>i%2===0).map((p,j)=>{const idx=j*2;return `<text x="${p[0]}" y="${h-6}" fill="#9fb0cb" font-size="9" text-anchor="middle">${String(times[idx]||'').slice(11,16)}</text>`}).join('');return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" width="100%" height="100%"><defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff8d6b" stop-opacity=".68"/><stop offset="1" stop-color="#7cc576" stop-opacity=".18"/></linearGradient></defs><path d="${area}" fill="url(#wg)"/><path d="${line}" fill="none" stroke="#ffd06b" stroke-width="3"/><g>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff"><title>${temps[i]}°C · hujan ${probs[i]||0}%</title></circle>`).join('')}</g>${labels}</svg>`}
async function loadWeatherDashboard(force=false){const host=document.getElementById('weatherDashboard');if(!host)return;if(!navigator.geolocation){host.innerHTML='<div class="weather-current">Geolocation tidak tersedia pada browser ini.</div>';return}host.innerHTML='<div class="weather-current"><i class="fa-solid fa-spinner fa-spin"></i> Mengambil lokasi & prakiraan cuaca…</div>';navigator.geolocation.getCurrentPosition(async pos=>{try{const {latitude:lat,longitude:lon}=pos.coords;const loc=await reverseLocation(lat,lon);const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation_probability,weather_code,wind_speed_10m,visibility,surface_pressure&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&forecast_days=8&timezone=auto`;const r=await fetch(url);if(!r.ok)throw new Error('Open-Meteo error');const d=await r.json();renderWeatherDashboard(host,d,loc,lat,lon)}catch(e){host.innerHTML=`<div class="weather-current"><b>Cuaca gagal dimuat.</b><div class="meta" style="color:#9fb0cb">${escapeHtml(String(e.message||e))}</div></div>`}},err=>host.innerHTML=`<div class="weather-current"><b>Izin lokasi diperlukan.</b><div class="meta" style="color:#9fb0cb;margin-top:5px">Aktifkan izin lokasi browser lalu tekan “Perbarui Lokasi”.</div></div>`,{enableHighAccuracy:false,timeout:12000,maximumAge:force?0:300000})}
function renderWeatherDashboard(host,d,loc,lat,lon){const c=d.current||{},di=d.daily||{},hi=d.hourly||{},[cond,ico]=weatherInfo(c.weather_code);const now=new Date();let hidx=(hi.time||[]).findIndex(t=>new Date(t)>=now);if(hidx<0)hidx=0;const slice=(a,n=12)=>(a||[]).slice(hidx,hidx+n);const moon=moonPhase(now);const vis=Math.round((hi.visibility?.[hidx]||0)/1000);const sunrise=String(di.sunrise?.[0]||'').slice(11,16),sunset=String(di.sunset?.[0]||'').slice(11,16);const map=`https://www.openstreetmap.org/export/embed.html?bbox=${lon-.16}%2C${lat-.10}%2C${lon+.16}%2C${lat+.10}&layer=mapnik&marker=${lat}%2C${lon}`;host.innerHTML=`<div class="weather-hero-grid"><section class="weather-current"><div class="weather-location">${escapeHtml(loc.city)}${loc.region?', '+escapeHtml(loc.region):''}</div><div class="weather-now"><i class="fa-solid ${ico} big-icon"></i><div><div class="temp">${Math.round(c.temperature_2m??0)}°C</div><div class="condition">${cond}</div><div class="meta" style="color:#9fb0cb">Terasa seperti ${Math.round(c.apparent_temperature??0)}°C</div></div></div><p style="font-size:10px;color:#d7e4f8;line-height:1.5">Prakiraan detail berdasarkan koordinat perangkat. Data cuaca diperbarui otomatis dari Open-Meteo.</p><div class="weather-facts"><div class="weather-fact">Angin<b>${Math.round(c.wind_speed_10m||0)} km/j</b></div><div class="weather-fact">Kelembapan<b>${c.relative_humidity_2m??'-'}%</b></div><div class="weather-fact">Jarak pandang<b>${vis||'-'} km</b></div><div class="weather-fact">Tekanan<b>${Math.round(c.surface_pressure||0)} mb</b></div><div class="weather-fact">Hujan<b>${c.precipitation??0} mm</b></div></div></section><section class="weather-map"><iframe loading="lazy" title="Peta lokasi cuaca" src="${map}"></iframe></section></div><div class="weather-tabs"><button class="active">Gambaran umum</button><button>Curah hujan</button><button>Angin</button><button>Kualitas udara</button><button>Kelembapan</button><button>Tekanan</button><button>UV</button></div><div class="weather-days">${(di.time||[]).slice(0,8).map((date,i)=>{const [name,ic]=weatherInfo(di.weather_code?.[i]);return `<div class="weather-day ${i===0?'today':''}"><b>${i===0?'Hari ini':new Date(date+'T00:00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric'})}</b><div class="wi"><i class="fa-solid ${ic}"></i></div><div class="mx">${Math.round(di.temperature_2m_max?.[i]||0)}°</div><div class="mn">${Math.round(di.temperature_2m_min?.[i]||0)}° · ${di.precipitation_probability_max?.[i]||0}%</div></div>`}).join('')}</div><section class="weather-panel"><h3>Gambaran umum per jam</h3><div class="hourly-strip">${slice(hi.time).map((t,i)=>{const [n,ic]=weatherInfo(slice(hi.weather_code)[i]);return `<div class="hourly-item"><span>${String(t).slice(11,16)}</span><i class="fa-solid ${ic}" title="${n}"></i><b>${Math.round(slice(hi.temperature_2m)[i]||0)}°</b><div>${slice(hi.precipitation_probability)[i]||0}%</div></div>`}).join('')}</div><div class="weather-chart">${svgWeatherChart(slice(hi.time),slice(hi.temperature_2m),slice(hi.precipitation_probability))}</div></section><div class="section-head" style="margin-top:16px"><h2 style="color:#fff">Detail Cuaca</h2><span class="meta" style="color:#9fb0cb">${new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</span></div><div class="weather-detail-grid"><div class="weather-metric"><div class="label">Temperatur</div><div class="metric-main">${Math.round(c.temperature_2m||0)}°</div><div class="weather-gauge"><span style="width:${Math.min(100,Math.max(10,(c.temperature_2m||0)*2.5))}%"></span></div><div class="metric-sub">Suhu saat ini di lokasi perangkat.</div></div><div class="weather-metric"><div class="label">Terasa seperti</div><div class="metric-main">${Math.round(c.apparent_temperature||0)}°</div><div class="metric-sub">Dipengaruhi kelembapan dan angin.</div></div><div class="weather-metric"><div class="label">Harapan hujan</div><div class="metric-main">${di.precipitation_probability_max?.[0]||0}%</div><div class="metric-sub">Total perkiraan ${di.precipitation_sum?.[0]||0} mm hari ini.</div></div><div class="weather-metric"><div class="label">Curah hujan</div><div class="metric-main">${c.precipitation??0}<small style="font-size:10px"> mm</small></div><div class="metric-sub">Pengukuran/perkiraan saat ini.</div></div><div class="weather-metric"><div class="label">Angin</div><div class="metric-main">${Math.round(c.wind_speed_10m||0)}</div><div class="metric-sub">km/j · arah ${windDir(c.wind_direction_10m)} · hembusan ${Math.round(c.wind_gusts_10m||0)} km/j</div></div><div class="weather-metric"><div class="label">Kelembapan</div><div class="metric-main">${c.relative_humidity_2m??'-'}%</div><div class="weather-gauge"><span style="width:${c.relative_humidity_2m||0}%"></span></div><div class="metric-sub">Kelembapan relatif udara.</div></div><div class="weather-metric"><div class="label">UV Maksimum</div><div class="metric-main">${Number(di.uv_index_max?.[0]||0).toFixed(1)}</div><div class="metric-sub">Indeks UV maksimum harian.</div></div><div class="weather-metric"><div class="label">Jarak pandang</div><div class="metric-main">${vis}<small style="font-size:10px"> km</small></div><div class="metric-sub">Estimasi visibility pada jam terdekat.</div></div><div class="weather-metric"><div class="label">Tekanan</div><div class="metric-main">${Math.round(c.surface_pressure||0)}</div><div class="metric-sub">mb · tekanan permukaan.</div></div><div class="weather-metric"><div class="label">Matahari</div><div class="metric-main" style="font-size:18px">${sunrise} — ${sunset}</div><div class="metric-sub">Terbit dan terbenam sesuai timezone lokasi.</div></div><div class="weather-metric"><div class="label">Fase Bulan</div><div class="metric-main">${moon.pct}%</div><div class="metric-sub">${moon.name} · estimasi fase astronomi.</div></div></div>`}

let prayerCity=null;let prayerPeriod=new Date();
function prayerPage(){return `<div class="prayer-page"><div class="container"><section class="prayer-hero"><div class="prayer-hero-top"><div><span class="badge" style="background:rgba(255,255,255,.15);color:#fff"><i class="fa-solid fa-mosque"></i> AINFO IBADAH</span><h1>Jadwal Sholat Sebulan</h1><p>Deteksi lokasi perangkat atau cari kabupaten/kota. Data bersumber dari Kemenag Bimas Islam melalui API Muslim MyQuran.</p></div><i class="fa-solid fa-mosque" style="font-size:42px;opacity:.25"></i></div><div class="prayer-search"><input id="prayerSearch" placeholder="Cari kota/kabupaten, contoh: Purbalingga"><button class="btn" onclick="searchPrayerLocation()"><i class="bi bi-search"></i> Cari</button><button class="btn" onclick="detectPrayerLocation()"><i class="fa-solid fa-location-crosshairs"></i> Lokasi Saya</button></div><div class="prayer-source">Sumber jadwal: Kementerian Agama RI / Bimas Islam. API mirror: api.myquran.com v3.</div></section><div id="prayerStatus" class="panel" style="margin-top:12px">Mendeteksi lokasi perangkat…</div><div id="prayerToday" class="prayer-today"></div><div class="prayer-toolbar"><div><span class="meta">Jadwal Bulanan</span><h2 id="prayerMonthTitle">—</h2></div><div class="prayer-month-nav"><button onclick="changePrayerMonth(-1)"><i class="bi bi-chevron-left"></i></button><button onclick="changePrayerMonth(1)"><i class="bi bi-chevron-right"></i></button></div></div><div id="prayerTable" class="prayer-table-wrap"><div style="padding:20px" class="muted">Menunggu data lokasi…</div></div><div class="prayer-note">Catatan: waktu sholat mengikuti data Kemenag Bimas Islam yang disajikan API mirror. Perbedaan beberapa menit dapat terjadi karena pembulatan, kebijakan lokal, atau pembaruan sumber.</div></div></div>`}
function prayerPeriodKey(){return `${prayerPeriod.getFullYear()}-${String(prayerPeriod.getMonth()+1).padStart(2,'0')}`}
async function prayerApi(path){try{const r=await fetch(path);if(r.ok)return await r.json()}catch(e){}const direct=path.includes('/api/prayer/search')?`https://api.myquran.com/v3/sholat/kabkota/cari/${encodeURIComponent(new URL(path,location.href).searchParams.get('q')||'jakarta')}`:`https://api.myquran.com/v3/sholat/jadwal/${encodeURIComponent(new URL(path,location.href).searchParams.get('id')||'')}/${encodeURIComponent(new URL(path,location.href).searchParams.get('period')||prayerPeriodKey())}?tz=Asia/Jakarta`;const r=await fetch(direct);if(!r.ok)throw new Error('API jadwal sholat tidak tersedia');return r.json()}
async function initPrayerPage(){if(!prayerCity)detectPrayerLocation();else loadPrayerMonth()}
async function detectPrayerLocation(){const st=document.getElementById('prayerStatus');if(st)st.textContent='Mengambil lokasi perangkat…';if(!navigator.geolocation)return searchPrayerLocation('Jakarta');navigator.geolocation.getCurrentPosition(async p=>{const loc=await reverseLocation(p.coords.latitude,p.coords.longitude);const keyword=(loc.city||loc.region||'Jakarta').replace(/^(Kota|Kabupaten)\s+/i,'');if(document.getElementById('prayerSearch'))document.getElementById('prayerSearch').value=keyword;searchPrayerLocation(keyword)},()=>{if(st)st.innerHTML='Izin lokasi tidak diberikan. Silakan cari kota/kabupaten secara manual.'},{timeout:12000,maximumAge:300000})}
async function searchPrayerLocation(keyword){keyword=keyword||document.getElementById('prayerSearch')?.value||'Jakarta';const st=document.getElementById('prayerStatus');if(st)st.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Mencari wilayah Kemenag…';try{const d=await prayerApi(`/api/prayer/search?q=${encodeURIComponent(keyword)}`);const arr=Array.isArray(d.data)?d.data:Array.isArray(d)?d:[];if(!arr.length)throw new Error('Wilayah tidak ditemukan');const norm=keyword.toUpperCase();prayerCity=arr.find(x=>String(x.lokasi||'').toUpperCase().includes(norm))||arr[0];if(st)st.innerHTML=`<b><i class="fa-solid fa-location-dot" style="color:var(--blue)"></i> ${escapeHtml(prayerCity.lokasi||keyword)}</b><div class="meta" style="margin-top:4px">ID wilayah Kemenag: ${escapeHtml(prayerCity.id||'')}</div>`;loadPrayerMonth()}catch(e){if(st)st.innerHTML=`<b>Jadwal belum dapat dimuat.</b><div class="meta">${escapeHtml(String(e.message||e))}</div>`}}
function changePrayerMonth(d){prayerPeriod=new Date(prayerPeriod.getFullYear(),prayerPeriod.getMonth()+d,1);loadPrayerMonth()}
function normalizePrayerRows(d){const root=d?.data??d;let rows=[];if(Array.isArray(root))rows=root;else if(Array.isArray(root?.jadwal))rows=root.jadwal;else if(root?.jadwal&&typeof root.jadwal==='object')rows=[root.jadwal];return rows}
function ptime(r,...keys){for(const k of keys){if(r?.[k]!=null)return r[k]}return'-'}
async function loadPrayerMonth(){if(!prayerCity)return;const title=document.getElementById('prayerMonthTitle');if(title)title.textContent=prayerPeriod.toLocaleDateString('id-ID',{month:'long',year:'numeric'});const table=document.getElementById('prayerTable');if(table)table.innerHTML='<div style="padding:20px"><i class="fa-solid fa-spinner fa-spin"></i> Memuat jadwal sebulan…</div>';try{const d=await prayerApi(`/api/prayer/month?id=${encodeURIComponent(prayerCity.id)}&period=${prayerPeriodKey()}`);const rows=normalizePrayerRows(d);if(!rows.length)throw new Error('Data bulan ini kosong');renderPrayerRows(rows)}catch(e){if(table)table.innerHTML=`<div style="padding:20px"><b>Gagal memuat jadwal.</b><div class="meta">${escapeHtml(String(e.message||e))}</div></div>`}}
function renderPrayerRows(rows){const todayKey=new Date().toISOString().slice(0,10);const normalizeDate=r=>normalizeScheduleDate(r.tanggal||r.date||r.tgl||'');const today=rows.find(r=>normalizeDate(r)===todayKey)||rows[0];const todayHost=document.getElementById('prayerToday');if(todayHost)todayHost.innerHTML=[['Imsak','fa-clock','imsak'],['Subuh','fa-cloud-moon','subuh'],['Dzuhur','fa-sun','dzuhur'],['Ashar','fa-cloud-sun','ashar'],['Maghrib','fa-cloud-sun','maghrib'],['Isya','fa-moon','isya']].map(([n,ic,k])=>`<div class="prayer-time"><i class="fa-solid ${ic}"></i><span>${n}</span><b>${ptime(today,k,k==='subuh'?'shubuh':k,k==='ashar'?'ashr':k)}</b></div>`).join('');const table=document.getElementById('prayerTable');if(table)table.innerHTML=`<table class="prayer-table"><thead><tr><th>Tanggal</th><th>Imsak</th><th>Subuh</th><th>Terbit</th><th>Dhuha</th><th>Dzuhur</th><th>Ashar</th><th>Maghrib</th><th>Isya</th></tr></thead><tbody>${rows.map(r=>{const dt=normalizeDate(r),d=new Date((dt||'2000-01-01')+'T00:00:00');return `<tr class="${dt===todayKey?'today':''}"><td><b>${Number.isNaN(d.getTime())?escapeHtml(dt):d.toLocaleDateString('id-ID',{weekday:'short',day:'2-digit',month:'short'})}</b></td><td>${ptime(r,'imsak','imsyak')}</td><td>${ptime(r,'subuh','shubuh')}</td><td>${ptime(r,'terbit')}</td><td>${ptime(r,'dhuha')}</td><td>${ptime(r,'dzuhur','dhuhr')}</td><td>${ptime(r,'ashar','ashr')}</td><td>${ptime(r,'maghrib')}</td><td>${ptime(r,'isya','isha')}</td></tr>`}).join('')}</tbody></table>`}

function adSlot(key,extraClass=''){const cfg=state.settings.adSlots?.[key]||AD_SLOT_DEFAULTS[key];if(!cfg||cfg.enabled===false)return'';const pub=(state.settings.adsensePublisher||'').trim(),slot=(cfg.slot||'').trim();let unit='';if(pub.startsWith('ca-pub-')&&slot){if(cfg.format==='inarticle')unit=`<ins class="adsbygoogle" style="display:block;text-align:center" data-ad-client="${escapeHtml(pub)}" data-ad-slot="${escapeHtml(slot)}" data-ad-layout="in-article" data-ad-format="fluid"></ins>`;else if(cfg.format==='native'&&cfg.layoutKey)unit=`<ins class="adsbygoogle" style="display:block" data-ad-client="${escapeHtml(pub)}" data-ad-slot="${escapeHtml(slot)}" data-ad-format="fluid" data-ad-layout-key="${escapeHtml(cfg.layoutKey)}"></ins>`;else unit=`<ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="${escapeHtml(pub)}" data-ad-slot="${escapeHtml(slot)}" data-ad-format="auto" data-full-width-responsive="true"></ins>`}const preview=state.settings.previewAds?`<div class="ad-preview"><div class="ad-label">Iklan</div><b>${escapeHtml(cfg.name||key)}</b><span>${escapeHtml(cfg.size||'Responsive')} · ${slot?'Slot '+slot:'Isi Slot ID di Admin'}</span></div>`:'';return `<div class="ad-placement ${extraClass}" data-ad-key="${key}" data-format="${escapeHtml(cfg.format||'auto')}">${unit||preview}</div>`}
function renderAnchorAd(){const root=document.getElementById('anchorAdRoot');if(!root)return;const cfg=state.settings.adSlots?.anchor||AD_SLOT_DEFAULTS.anchor;if(!cfg?.enabled||current()==='video'||!state.settings.previewAds){root.innerHTML='';return}root.innerHTML=`<div class="anchor-ad-preview"><div><span class="ad-label">Anchor Ad · Preview Production</span><b>${escapeHtml(cfg.name)}</b> · ${escapeHtml(cfg.note||'')}</div><button onclick="this.parentElement.remove()" aria-label="Tutup iklan">×</button></div>`}
function initAdsense(){const pub=(state.settings.adsensePublisher||'').trim();if(!pub||!pub.startsWith('ca-pub-'))return;const push=()=>document.querySelectorAll('.adsbygoogle').forEach(el=>{if(el.dataset.ainfoLoaded)return;try{(window.adsbygoogle=window.adsbygoogle||[]).push({});el.dataset.ainfoLoaded='1'}catch(e){}});if(!document.querySelector('script[data-ainfo-adsense]')){const sc=document.createElement('script');sc.async=true;sc.dataset.ainfoAdsense='1';sc.crossOrigin='anonymous';sc.src=`https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${encodeURIComponent(pub)}`;document.head.appendChild(sc);sc.onload=push}else setTimeout(push,120)}
function updateSEO(route,id){let title=state.settings.seoTitle,desc=state.settings.seoDescription,img=(state.settings.domain||'https://www.ainfo.web.id').replace(/\/$/,'')+'/AINFO.png',canonical=(state.settings.domain||'https://www.ainfo.web.id').replace(/\/$/,'')+'/';if(route==='article'){const a=articles.find(x=>x.id===id)||articles[0];title=`${a.title} - AINFO`;desc=a.excerpt;img=a.image;canonical=canonicalArticleUrl(a)}else if(route==='category'){const cat=decodeURIComponent(location.hash.split('/')[2]||'Berita');title=`${cat} - Berita Terkini AINFO`;desc=`Berita terbaru kategori ${cat} dari AINFO.`;canonical+=`kategori/${slugifyText(cat)}/`}else if(route==='shop'){title='AINFO Shopping - Produk Pilihan';desc='Belanja produk pilihan melalui AINFO Shopping.';canonical+=( 'shopping/' )}else if(route==='jobs'){title='AINFO Jobs - Lowongan Kerja Terbaru';desc='Cari lowongan kerja terbaru melalui AINFO Jobs.';canonical+='jobs/'}else if(route==='video'){title='AINFO Video - Berita & Cerita Vertikal';desc='Video berita AINFO dalam format vertikal 9:16.';canonical+='video/'}else if(route==='weather'){title='Prakiraan Cuaca Detail - AINFO';desc='Prakiraan cuaca detail berdasarkan lokasi perangkat.';canonical+='cuaca/'}else if(route==='prayer'){title='Jadwal Sholat Sebulan - AINFO';desc='Jadwal sholat bulanan berbasis data Kemenag Bimas Islam.';canonical+='jadwal-sholat/'}else if(route==='profile'){title='Profile Saya - AINFO';desc='Kelola akun dan aktivitas AINFO.';canonical+='profile/'}document.title=title;const ensure=(sel,attr,val)=>{let el=document.querySelector(sel);if(!el){el=document.createElement('meta');Object.entries(attr).forEach(([k,v])=>el.setAttribute(k,v));document.head.appendChild(el)}el.setAttribute('content',val||'')};ensure('meta[name="description"]',{name:'description'},desc);ensure('meta[name="keywords"]',{name:'keywords'},state.settings.seoKeywords||'');if(state.settings.googleVerification)ensure('meta[name="google-site-verification"]',{name:'google-site-verification'},state.settings.googleVerification);ensure('meta[name="robots"]',{name:'robots'},['login','register','onboarding','profile','cart','saved'].includes(route)?'noindex,nofollow':'index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1');ensure('meta[property="og:title"]',{property:'og:title'},title);ensure('meta[property="og:description"]',{property:'og:description'},desc);ensure('meta[property="og:type"]',{property:'og:type'},route==='article'?'article':'website');ensure('meta[property="og:site_name"]',{property:'og:site_name'},'AINFO');ensure('meta[property="og:url"]',{property:'og:url'},canonical);ensure('meta[property="og:image"]',{property:'og:image'},img);ensure('meta[name="twitter:card"]',{name:'twitter:card'},'summary_large_image');ensure('meta[name="twitter:title"]',{name:'twitter:title'},title);ensure('meta[name="twitter:description"]',{name:'twitter:description'},desc);ensure('meta[name="twitter:image"]',{name:'twitter:image'},img);let can=document.querySelector('link[rel="canonical"]');if(!can){can=document.createElement('link');can.rel='canonical';document.head.appendChild(can)}can.href=canonical}
let ainfoSearchCache={q:'',articles:[],products:[],jobs:[],loading:false,error:''};
function searchPage(q){return `<div class="page"><div class="container" style="padding-top:18px"><div class="section-title"><div><span class="badge">PENCARIAN</span><h2>Hasil untuk “${escapeHtml(q)}”</h2></div></div><div id="searchResults">${ainfoSearchCache.loading?'<div class="card"><i class="fa-solid fa-spinner fa-spin"></i> Mencari…</div>':ainfoSearchCache.error?`<div class="card">${escapeHtml(ainfoSearchCache.error)}</div>`:'<div class="card">Masukkan kata kunci minimal 2 karakter.</div>'}</div></div></div>`}
async function runGlobalSearch(q){q=String(q||'').trim();if(q.length<2)return;ainfoSearchCache={q,articles:[],products:[],jobs:[],loading:true,error:''};if(current()!=='search'||decodeURIComponent(location.hash.split('/')[2]||'')!==q){location.hash='#/search/'+encodeURIComponent(q);return}render();try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const d=await r.json();if(!r.ok)throw new Error(d.message||'Pencarian gagal');ainfoSearchCache={q,articles:d.articles||[],products:d.products||[],jobs:d.jobs||[],loading:false,error:''};const host=document.getElementById('searchResults');if(host)host.innerHTML=`<div class="grid"><div class="card"><h3>Berita (${ainfoSearchCache.articles.length})</h3>${ainfoSearchCache.articles.map(a=>`<div class="rec-item" onclick="location.href='/read/${encodeURIComponent(a.slug)}/'"><img src="${escapeHtml(a.image_url||'./AINFO.png')}" alt=""><div><b>${escapeHtml(a.title)}</b><div class="meta">${escapeHtml(a.category||'Berita')} · ${Number(a.views||0).toLocaleString('id-ID')} pembaca</div></div></div>`).join('')||'<div class="meta">Tidak ada hasil.</div>'}</div><div class="card"><h3>Shopping (${ainfoSearchCache.products.length})</h3>${ainfoSearchCache.products.map(p=>`<div class="job-card" onclick="go('product/${p.id}')"><div><b>${escapeHtml(p.name)}</b><div class="meta">${escapeHtml(p.category||'')} · ${money(p.price||0)}</div></div></div>`).join('')||'<div class="meta">Tidak ada hasil.</div>'}<h3 style="margin-top:18px">Jobs (${ainfoSearchCache.jobs.length})</h3>${ainfoSearchCache.jobs.map(j=>`<div class="job-card" onclick="go('jobs')"><div><b>${escapeHtml(j.title)}</b><div class="meta">${escapeHtml(j.company||'')} · ${escapeHtml(j.location||'')}</div></div></div>`).join('')||'<div class="meta">Tidak ada hasil.</div>'}</div></div>`}catch(e){ainfoSearchCache.loading=false;ainfoSearchCache.error=e.message||String(e);render()}}
document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(!q)return;runGlobalSearch(q)}});
window.addEventListener('hashchange',()=>{stopArticleAudio(false);toggleDrawer(false);render()});window.addEventListener('load',()=>{if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();syncAuth(true).then(()=>{if(['profile','onboarding'].includes(current()))render()});setTimeout(()=>document.getElementById('appSplash')?.classList.add('hide'),650);setTimeout(()=>{updatePwaInstallButtons();if(!isPwaStandalone()&&!localStorage.getItem(PWA_INSTALL_SEEN))showPwaInstallPopup(true)},1450)});
</script>
